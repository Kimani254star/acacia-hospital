<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Pharmacy & Medical Supplies</title><link rel="stylesheet" href="css/shop.css"></head>
<body>
<header class="top"><a class="brand" href="index.html">💊 Apex Pharmacy</a>
  <input id="search" placeholder="Search medicines, vitamins, equipment…">
  <button id="cartBtn" class="btn">Cart (<span id="cartN">0</span>)</button><a class="staff" href="portal.html">Staff login</a></header>
<section class="hero"><h1>Verified medicines, delivered.</h1><p>Prescription, OTC, vitamins and first-aid supplies from a licensed pharmacy.</p></section>
<nav id="cats" class="cats"></nav>
<main><div id="grid" class="grid"></div></main>
<aside id="cart" class="drawer" hidden><div class="dh"><h2>Your cart</h2><button id="closeCart" class="x">×</button></div>
  <div id="lines"></div><h3 id="total"></h3>
  <form id="checkout"><input id="cName" placeholder="Full name" required><input id="cPhone" placeholder="Phone (07…)" required>
    <input id="cAddr" placeholder="Delivery address" required>
    <select id="cPay"><option>M-Pesa</option><option>Cash on delivery</option></select>
    <p class="note" id="rxNote" hidden>Your cart has prescription items. A pharmacist will verify your prescription before delivery.</p>
    <button class="btn">Place order</button></form></aside>
<footer>© Apex Pharmacy & Medical Supplies</footer><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/shop.js"></script>
</body></html>
