<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Pharmacy - Staff Portal</title>
<link rel="stylesheet" href="css/portal.css"></head>
<body>
<div id="login" class="login"><form id="loginForm" class="card">
  <h1>Apex Pharmacy</h1><p class="muted">Staff sign in</p>
  <input id="lEmail" type="email" placeholder="Email" required><input id="lPass" type="password" placeholder="Password" required>
  <button class="btn">Sign in</button><p id="lErr" class="err"></p><a href="index.html">← Back to shop</a></form></div>
<div id="app" class="app" hidden>
  <aside class="side"><h2>Apex Pharmacy</h2><nav id="nav"></nav>
    <div class="who"><span id="who"></span><button id="logout" class="btn ghost">Sign out</button></div></aside>
  <main><header><h1 id="title"></h1><span id="status" class="muted"></span></header><section id="view"></section></main>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/core.js"></script>
<script src="js/dashboard.js"></script><script src="js/pos.js"></script><script src="js/inventory.js"></script><script src="js/customers.js"></script><script src="js/sales.js"></script><script src="js/orders.js"></script>
<script src="js/app.js"></script>
</body></html>
